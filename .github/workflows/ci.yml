name: CI — Build, Typecheck & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit tests (150 archetypes, PRNG, audio, persistence)
        run: npm run test:unit

      - name: Run component & navigation tests
        run: npm test

      - name: Build production bundle
        run: npm run build
